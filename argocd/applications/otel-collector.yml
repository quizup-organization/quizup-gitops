apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    # Wave 1 : point d'entrée OTLP des traces, avant l'activation du tracing côté services.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.173.1
    helm:
      releaseName: otel-collector
      values: |
        # Nom court du Service : l'endpoint OTLP par défaut du SDK est
        # `otel-collector.monitoring.svc.cluster.local`.
        fullnameOverride: otel-collector

        mode: deployment
        replicaCount: 1

        image:
          repository: otel/opentelemetry-collector
        command:
          name: otelcol

        # Config complète (remplace les défauts) : pipeline traces uniquement, vers Tempo.
        alternateConfig:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 5s
              # Aligné sur la limite conteneur (384Mi) : seuil « mou » ~230Mi, sinon le collecteur
              # refuse les spans (503 « data refused due to high memory usage ») → WARN en boucle.
              limit_percentage: 75
              spike_limit_percentage: 15
            batch:
              send_batch_size: 1024
              timeout: 5s
          exporters:
            otlp/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
              # File + retry : encaisse les hoquets de Tempo/limiteur sans renvoyer d'erreur aux apps.
              sending_queue:
                enabled: true
                queue_size: 1000
                num_consumers: 4
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 120s
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          service:
            extensions:
              - health_check
            pipelines:
              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlp/tempo

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
