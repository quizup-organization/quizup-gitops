apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt-issuer
  namespace: argocd
  annotations:
    # Après l'installation de cert-manager (wave 0 : Application `cert-manager`).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quizup-organization/quizup-gitops.git
    targetRevision: main
    path: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
