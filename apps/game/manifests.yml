apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizup-game
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: quizup
      app: quizup-game
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quizup
        app.kubernetes.io/component: axon
        app: quizup-game
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: quizup-game
          image: ghcr.io/quizup-organization/game:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-service-config
            - configMapRef:
                name: quizup-game-config
            - secretRef:
                name: quizup-game-secret
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quizup-game
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-game
spec:
  selector:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-game
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-game-config
  namespace: quizup-prod
data:
  QUIZUP_DB_HOST: postgres
  QUIZUP_DB_PORT: "5432"
  QUIZUP_DB_NAME: quizup_game
  # URL publique du serveur OpenAPI (acces via le gateway).
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.quizup.cnadjim.fr/game-service
  QUIZUP_DB_USERNAME: quizup
  QUIZUP_LOG_LEVEL: INFO
