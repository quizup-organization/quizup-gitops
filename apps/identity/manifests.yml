apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
spec:
  # 1 réplique : le scaling nécessite un `QUIZUP_IDENTITY_JWK` partagé (clés de signature JWT identiques).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: quizup
      app: quizup-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quizup
        app.kubernetes.io/component: axon
        app: quizup-identity
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: quizup-identity
          image: ghcr.io/quizup-organization/identity:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-identity-config
            - secretRef:
                name: quizup-identity-secret
            - secretRef:
                name: quizup-identity-grafana
            - secretRef:
                name: quizup-identity-mail
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
spec:
  selector:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-identity-config
  namespace: quizup-prod
data:
  QUIZUP_DB_HOST: postgres
  QUIZUP_DB_PORT: "5432"
  QUIZUP_DB_NAME: quizup_identity
  QUIZUP_DB_USERNAME: quizup
  QUIZUP_KAFKA_HOST: kafka
  QUIZUP_KAFKA_PORT: "9092"
  AXON_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # OIDC : issuer public vu par le navigateur (doit matcher l'authority de la SPA).
  QUIZUP_IDENTITY_ISSUER: https://identity.quizup.cnadjim.fr
  QUIZUP_AUTH_SERVER_URL: http://quizup-identity.quizup-prod.svc.cluster.local
  QUIZUP_AUTH_SERVER_JWKS_URL: http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/jwks
  QUIZUP_APP_LOGIN_URI: https://app.quizup.cnadjim.fr/login
  QUIZUP_APP_OAUTH2_SUCCESS_URI: https://app.quizup.cnadjim.fr/login?social=success
  QUIZUP_APP_OAUTH2_FAILURE_URI: https://app.quizup.cnadjim.fr/login?error
  QUIZUP_CORS_ALLOWED_ORIGINS: https://app.quizup.cnadjim.fr,https://api.quizup.cnadjim.fr
  QUIZUP_SESSION_COOKIE_SECURE: "true"
  # Tracing distribué : activé par le SDK d'observabilité (désactivé par défaut).
  MICROSERVICE_OBSERVABILITY_TRACING_ENABLED: "true"
  # Pool JDBC réduit (Postgres max_connections=150 partagé par 7 bases).
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
  # Swagger : URL publique via le gateway + masque les endpoints internes Axon.
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.quizup.cnadjim.fr/identity-service
  SPRINGDOC_PATHS_TO_EXCLUDE: /command-capabilities,/query-capabilities,/command-transport,/spring-command-bus-connector/**,/spring-query-bus-connector/**
  QUIZUP_LOG_LEVEL: INFO
  # Découverte Kubernetes native (prod). Désactivée par défaut dans le SDK.
  SPRING_CLOUD_KUBERNETES_ENABLED: "true"
  SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "true"
  # Client OAuth2 sortant `server-client` (client_credentials) : requis par le RestTemplate
  # tokenisé du SDK pour interroger les `/command-capabilities` des pairs (bus Axon distribué).
  # Identity n'inclut pas `quizup-service-config` ; on redéclare donc la registration ici
  # avec SON secret (QUIZUP_IDENTITY_SERVER_CLIENT_SECRET) et les URLs in-cluster.
  SPRING_APPLICATION_JSON: >-
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"quizup-identity","client-id":"server","client-secret":"${QUIZUP_IDENTITY_SERVER_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"quizup-identity":{"token-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/jwks"}}}}}}}
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"quizup-identity","client-id":"server","client-secret":"${QUIZUP_IDENTITY_SERVER_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"quizup-identity":{"token-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/jwks"}}}}}}
  # Seeding : crée le compte système unique (admin + bot), sans credential.
  QUIZUP_SEED_DATA_ENABLED: "true"
  # Liste blanche d'emails obtenant ROLE_ADMIN (Grafana).
  QUIZUP_ADMIN_EMAILS: c.nadjim@gmail.com
  # Emails transactionnels (codes de connexion OTP) via Resend.
  # La clé API est portée par le secret quizup-identity-mail.
  QUIZUP_MAIL_FROM: QuizUp <no-reply@quizup.cnadjim.fr>
  QUIZUP_MAIL_BASE_URL: https://api.resend.com
