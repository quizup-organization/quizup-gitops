apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-quizup-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: quizup
data:
  quizup-slo.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["quizup", "slo"],
      "title": "QuizUp — SLO",
      "uid": "quizup-slo",
      "version": 1,
      "time": { "from": "now-24h", "to": "now" },
      "timezone": "browser",
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services UP",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 8 } ] } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum(up{namespace=\"quizup-prod\", job=~\"game|gateway|identity|leaderboard|matchmaking|profile|social|theme\"})" } ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Disponibilité (30j)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 9, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0.995 }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - (sum(rate(http_server_requests_seconds_count{outcome=\"SERVER_ERROR\"}[30d])) / sum(rate(http_server_requests_seconds_count[30d])))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Budget d'erreur consommé (30j, cible 99.5%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 9, "x": 15, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 0.75 }, { "color": "red", "value": 1 } ] }, "max": 1 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_server_requests_seconds_count{outcome=\"SERVER_ERROR\"}[30d])) / sum(rate(http_server_requests_seconds_count[30d]))) / (1 - 0.995)"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Taux de succès par service",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0.9, "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (rate(http_server_requests_seconds_count{outcome!=\"SERVER_ERROR\"}[$__rate_interval])) / sum by (application) (rate(http_server_requests_seconds_count[$__rate_interval]))",
              "legendFormat": "{{application}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latence p95 par service (seuil 500 ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 10, "lineWidth": 1 },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.5 } ] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{application}}"
            }
          ]
        }
      ]
    }
