apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repo-creds
  namespace: argocd
  annotations:
    # Avant argocd-image-updater (wave 0) : lui fournit le credential git d'écriture.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quizup-organization/quizup-gitops.git
    targetRevision: main
    path: argocd/repo-creds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
