apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizup-console
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app: quizup-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: quizup
      app: quizup-console
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quizup
        # Pas de label `app.kubernetes.io/component: axon` : la console n'a PAS de runtime Axon
        # (elle ne doit pas être découverte comme pair des bus distribués).
        app: quizup-console
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: quizup-console
          image: ghcr.io/quizup-organization/console:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-common-config
            - configMapRef:
                name: quizup-oauth-client-config
            - configMapRef:
                name: quizup-console-config
            - secretRef:
                name: quizup-console-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quizup-console
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app: quizup-console
spec:
  selector:
    app.kubernetes.io/part-of: quizup
    app: quizup-console
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-console-config
  namespace: quizup-prod
data:
  QUIZUP_DB_NAME: quizup_console
