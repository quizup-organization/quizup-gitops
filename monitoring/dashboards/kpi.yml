apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-quizup-kpi
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: quizup
data:
  quizup-kpi.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["quizup", "kpi"],
      "title": "QuizUp — KPI métier",
      "uid": "quizup-kpi",
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Parties créées /s (mode, adversaire)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (mode, opponent) (rate(quizup_game_games_created_total[5m]))", "legendFormat": "{{mode}} / {{opponent}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Parties terminées /s (résultat)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (outcome, forfeited) (rate(quizup_game_games_ended_total[5m]))", "legendFormat": "{{outcome}} (forfait={{forfeited}})" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Taux de bonnes réponses",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (player_type) (rate(quizup_game_answers_total{correct=\"true\"}[5m])) / sum by (player_type) (rate(quizup_game_answers_total[5m]))", "legendFormat": "{{player_type}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latence de réponse p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(quizup_game_answer_duration_seconds_bucket[5m])))" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Connexions (succès / échec)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (result) (rate(quizup_auth_logins_total[5m]))", "legendFormat": "{{result}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Inscriptions /s (méthode)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (method) (rate(quizup_auth_registrations_total[5m]))", "legendFormat": "{{method}}" }
          ]
        }
      ]
    }
