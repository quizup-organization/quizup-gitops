apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizup-notification
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: quizup
      app: quizup-notification
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quizup
        app.kubernetes.io/component: axon
        app: quizup-notification
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: quizup-notification
          image: ghcr.io/quizup-organization/notification:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-common-config
            - configMapRef:
                name: quizup-oauth-client-config
            - configMapRef:
                name: quizup-notification-config
            - secretRef:
                name: quizup-notification-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quizup-notification
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-notification
spec:
  selector:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-notification
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-notification-config
  namespace: quizup-prod
data:
  QUIZUP_DB_NAME: quizup_notification
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.quizup.cnadjim.fr/notification-service
