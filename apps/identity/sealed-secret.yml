# Généré par scripts/seal-secrets.sh (cible `identity`) — NE PAS éditer à la main.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: quizup-identity-secret
  namespace: quizup-prod
spec:
  encryptedData:
    QUIZUP_DB_PASSWORD: CHANGE_ME
    QUIZUP_IDENTITY_SERVER_CLIENT_SECRET: CHANGE_ME
    QUIZUP_IDENTITY_ADMIN_CLIENT_SECRET: CHANGE_ME
    # JWK Set JSON partagée par toutes les instances (clés de signature JWT).
    QUIZUP_IDENTITY_JWK: CHANGE_ME
  template:
    metadata:
      name: quizup-identity-secret
      namespace: quizup-prod
    type: Opaque
