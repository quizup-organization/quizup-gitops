apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: quizup
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
          # Corrélation logs -> traces : extrait `trace.id` du log JSON ECS.
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace\.id":"([a-f0-9]+)"'
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: "Voir la trace"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: quizup
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        editable: false
        jsonData:
          # Corrélation traces -> logs : filtre Loki sur le trace_id du span.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{namespace="quizup-prod"} | json | trace_id="$${__span.traceId}"'
