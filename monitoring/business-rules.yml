# Alertes métier QuizUp (KPI applicatifs exposés par les services).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: quizup-business-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: quizup
spec:
  groups:
    - name: quizup.business
      rules:
        - alert: QuizupHighAuthFailureRate
          expr: |
            (sum(rate(quizup_auth_logins_total{result="failure"}[5m]))
              / clamp_min(sum(rate(quizup_auth_logins_total[5m])), 0.0001)) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Taux d'échec de connexion élevé (> 50 %)"
            description: "Plus de la moitié des tentatives de login échouent depuis 10 min (identity)."

        - alert: QuizupMatchmakingWaitHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(quizup_matchmaking_match_wait_seconds_bucket[10m]))) > 8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Temps d'attente matchmaking p95 > 8 s"
            description: "L'appariement des lobbies dépasse 8 s (p95) depuis 10 min (matchmaking)."

        - alert: QuizupWebSocketMessageFailures
          expr: |
            sum(rate(quizup_websocket_messages_total{result="failed"}[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Échecs d'envoi de messages WebSocket"
            description: "Des trames STOMP échouent côté serveur (> 0,2/s depuis 10 min)."
