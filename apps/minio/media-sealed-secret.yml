# Scellé le 2026-10-12 (kubeseal 0.40.0, contrôleur sealed-secrets-controller, ns sealed-secrets).
# Utilisateur applicatif MinIO du BFF (bucket quizup-media), créé par le hook PostSync
# `minio-init`, injecté dans le Deployment BFF via envFrom
# (robable : ./scripts/seal-secrets.sh bff-media).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: quizup-bff-media
  namespace: quizup-prod
spec:
  encryptedData:
    QUIZUP_MEDIA_ACCESS_KEY: 
    QUIZUP_MEDIA_SECRET_KEY: 
  template:
    metadata:
      name: quizup-bff-media
      namespace: quizup-prod
