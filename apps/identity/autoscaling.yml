apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app: quizup-identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quizup-identity
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Démarrage Spring long (startupProbe ~200 s max) : on évite tout flapping.
      stabilizationWindowSeconds: 600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app: quizup-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quizup-identity
