# Redis — état chaud du session tier (matchmaking, lobby, présence).
#
# AOF everysec (perte max ~1 s d'état éphémère au crash) + noeviction : les sessions ne sont
# jamais évincées silencieusement sous pression mémoire (la borne `maxmemory` fait échouer les
# écritures au lieu de perdre des sessions). Pas d'auth in-cluster (même posture que Kafka
# PLAINTEXT) : le Service n'est jamais exposé hors du cluster.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: quizup-prod
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: quizup-prod
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Données locales (local-path) : épinglé au nœud qui porte le volume.
      nodeSelector:
        kubernetes.io/hostname: pi-node1
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
