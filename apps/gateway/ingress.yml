apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: quizup-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.quizup.cnadjim.fr
      secretName: api-quizup-cnadjim-fr-tls
  rules:
    - host: api.quizup.cnadjim.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
