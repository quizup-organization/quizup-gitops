apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-quizup-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: quizup
data:
  quizup-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["quizup", "logs"],
      "title": "QuizUp — Logs",
      "uid": "quizup-logs",
      "version": 1,
      "time": { "from": "now-3h", "to": "now" },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"quizup-prod\"}, app)",
            "includeAll": true,
            "multi": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Volume de logs par service",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (app) (count_over_time({namespace=\"quizup-prod\", app=~\"$app\"} [5m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Erreurs par service",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (app) (count_over_time({namespace=\"quizup-prod\", app=~\"$app\"} | json | log_level=~\"ERROR|FATAL\" [5m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "logs",
          "title": "Logs récents",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"quizup-prod\", app=~\"$app\"}",
              "maxLines": 500
            }
          ]
        }
      ]
    }
