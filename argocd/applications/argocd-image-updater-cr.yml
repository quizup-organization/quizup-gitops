apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater-cr
  namespace: argocd
  annotations:
    # Après l'installation d'argocd-image-updater (wave 0) qui fournit le CRD.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quizup-organization/quizup-gitops.git
    targetRevision: main
    path: argocd/image-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
