apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
spec:
  # 1 réplique : le scaling nécessite un `QUIZUP_IDENTITY_JWK` partagé (clés de signature JWT identiques).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: quizup
      app: quizup-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quizup
        app.kubernetes.io/component: axon
        app: quizup-identity
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: quizup-identity
          image: ghcr.io/quizup-organization/identity:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-common-config
            - configMapRef:
                name: quizup-identity-config
            - secretRef:
                name: quizup-identity-secret
            - secretRef:
                name: quizup-identity-grafana
            - secretRef:
                name: quizup-identity-mail
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: quizup-identity
  namespace: quizup-prod
  labels:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
spec:
  selector:
    app.kubernetes.io/part-of: quizup
    app.kubernetes.io/component: axon
    app: quizup-identity
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-identity-config
  namespace: quizup-prod
data:
  # Clés spécifiques à identity ; le reste (DB host/port/user, Kafka, K8s, tracing,
  # hikari, springdoc) provient de `quizup-common-config`.
  QUIZUP_DB_NAME: quizup_identity
  # OIDC : issuer public vu par le navigateur (doit matcher l'authority de la SPA).
  QUIZUP_IDENTITY_ISSUER: https://identity.quizup.cnadjim.fr
  QUIZUP_APP_LOGIN_URI: https://app.quizup.cnadjim.fr/login
  QUIZUP_APP_OAUTH2_SUCCESS_URI: https://app.quizup.cnadjim.fr/login?social=success
  QUIZUP_APP_OAUTH2_FAILURE_URI: https://app.quizup.cnadjim.fr/login?error
  QUIZUP_CORS_ALLOWED_ORIGINS: https://app.quizup.cnadjim.fr,https://api.quizup.cnadjim.fr
  QUIZUP_SESSION_COOKIE_SECURE: "true"
  # Swagger : URL publique via le gateway.
  MICROSERVICE_SWAGGER_SERVER_URL: https://api.quizup.cnadjim.fr/identity-service
  # Client OAuth2 sortant `server-client` (client_credentials), avec SON secret.
  SPRING_APPLICATION_JSON: >-
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"quizup-identity","client-id":"server","client-secret":"${QUIZUP_IDENTITY_SERVER_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"quizup-identity":{"token-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://quizup-identity.quizup-prod.svc.cluster.local/oauth2/jwks"}}}}}}}
  # Seeding : crée le compte système unique (admin + bot), sans credential.
  QUIZUP_SEED_DATA_ENABLED: "true"
  # Liste blanche d'emails obtenant ROLE_ADMIN (Grafana).
  QUIZUP_ADMIN_EMAILS: c.nadjim@gmail.com
  # Emails transactionnels (codes de connexion OTP) via Resend.
  # La clé API est portée par le secret quizup-identity-mail.
  QUIZUP_MAIL_FROM: QuizUp <no-reply@quizup.cnadjim.fr>
  QUIZUP_MAIL_BASE_URL: https://api.resend.com
