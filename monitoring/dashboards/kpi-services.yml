apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-quizup-kpi-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: quizup
data:
  quizup-kpi-services.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["quizup", "kpi"],
      "title": "QuizUp — KPI services",
      "uid": "quizup-kpi-services",
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Matchmaking — matchs formés /s",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (vs_bot) (rate(quizup_matchmaking_matches_total[5m]))", "legendFormat": "vs_bot={{vs_bot}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Matchmaking — temps d'attente p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(quizup_matchmaking_match_wait_seconds_bucket[5m])))" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Social — abonnements / désabonnements /s",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(quizup_social_topic_follows_total[5m]))", "legendFormat": "topics suivis" },
            { "refId": "B", "expr": "sum(rate(quizup_social_topic_unfollows_total[5m]))", "legendFormat": "topics désuivis" },
            { "refId": "C", "expr": "sum(rate(quizup_social_user_follows_total[5m]))", "legendFormat": "joueurs suivis" },
            { "refId": "D", "expr": "sum(rate(quizup_social_user_unfollows_total[5m]))", "legendFormat": "joueurs désuivis" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Social — défis /s (créés, acceptés, déclinés, expirés)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(quizup_social_challenges_created_total[5m]))", "legendFormat": "créés" },
            { "refId": "B", "expr": "sum(rate(quizup_social_challenges_accepted_total[5m]))", "legendFormat": "acceptés" },
            { "refId": "C", "expr": "sum(rate(quizup_social_challenges_declined_total[5m]))", "legendFormat": "déclinés" },
            { "refId": "D", "expr": "sum(rate(quizup_social_challenges_expired_total[5m]))", "legendFormat": "expirés" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Progression — XP attribuée /s",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (won) (rate(quizup_profile_xp_awarded_total[5m]))", "legendFormat": "won={{won}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Progression — XP moyenne par partie",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(quizup_profile_xp_amount_sum[5m])) / clamp_min(sum(rate(quizup_profile_xp_amount_count[5m])), 0.0001)" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Progression — badges /s",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (badge) (rate(quizup_profile_badges_earned_total[5m]))", "legendFormat": "{{badge}}" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Classement — XP enregistrée /s",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(quizup_leaderboard_xp_recorded_total[5m]))" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "WebSocket — sessions actives",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (application) (quizup_websocket_sessions_active)", "legendFormat": "{{application}}" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "WebSocket — messages /s (par résultat)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 1 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (result) (rate(quizup_websocket_messages_total[5m]))", "legendFormat": "{{result}}" }
          ]
        }
      ]
    }
