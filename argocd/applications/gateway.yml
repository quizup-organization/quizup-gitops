apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quizup-gateway
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: gateway=ghcr.io/quizup-organization/gateway
    argocd-image-updater.argoproj.io/gateway.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quizup-organization/quizup-gitops.git
    targetRevision: main
    path: apps/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: quizup-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
