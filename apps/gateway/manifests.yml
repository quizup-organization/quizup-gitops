apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: quizup-prod
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: gateway
          image: ghcr.io/quizup-organization/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          envFrom:
            - configMapRef:
                name: quizup-gateway-config
            - secretRef:
                name: quizup-gateway-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: quizup-prod
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-gateway-config
  namespace: quizup-prod
data:
  QUIZUP_GATEWAY_IDENTITY_URL: http://identity.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_PROFILE_URL: http://profile.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_GAME_URL: http://game.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_THEME_URL: http://theme.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_SOCIAL_URL: http://social.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_MATCHMAKING_URL: http://matchmaking.quizup-prod.svc.cluster.local
  QUIZUP_GATEWAY_LEADERBOARD_URL: http://leaderboard.quizup-prod.svc.cluster.local
  QUIZUP_LOG_LEVEL: INFO
  QUIZUP_GATEWAY_LOG_LEVEL: INFO
