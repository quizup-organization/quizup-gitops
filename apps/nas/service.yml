apiVersion: v1
kind: Service
metadata:
  name: nas
  namespace: quizup-prod
  labels:
    app: nas
spec:
  # Service sans sélecteur : les endpoints sont fournis manuellement (NAS LAN).
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas
  namespace: quizup-prod
  labels:
    kubernetes.io/service-name: nas
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.72
