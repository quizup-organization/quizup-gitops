# Configuration partagée par les microservices (hors identity) : broker Axon (Kafka) et
# client OAuth2 `server-client` (client_credentials) requis par le ResourceServerAutoConfiguration
# du SDK. Le secret du client est fourni par chaque SealedSecret de service.
#
# Le client OAuth2 est déclaré via SPRING_APPLICATION_JSON : un id de registration contenant un
# tiret (`server-client`) ne peut pas être bindé depuis une variable d'environnement classique
# (`..._REGISTRATION_SERVER_CLIENT_...` est interprété comme `server.client`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-service-config
  namespace: quizup-prod
data:
  QUIZUP_KAFKA_HOST: kafka
  QUIZUP_KAFKA_PORT: "9092"
  # Axon (extension axon-kafka) lit axon.kafka.bootstrap-servers (défaut localhost:9092),
  # distinct de spring.kafka.bootstrap-servers utilisé par Spring Kafka.
  AXON_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  QUIZUP_AUTH_SERVER_URL: http://identity.quizup-prod.svc.cluster.local
  QUIZUP_AUTH_SERVER_JWKS_URL: http://identity.quizup-prod.svc.cluster.local/oauth2/jwks

  # Tracing distribué : activé par le SDK d'observabilité (désactivé par défaut).
  # L'endpoint OTLP par défaut du SDK pointe vers otel-collector.monitoring.
  MICROSERVICE_OBSERVABILITY_TRACING_ENABLED: "true"

  # Swagger UI : l'URL d'autorisation OAuth2 doit être PUBLIQUE (le navigateur y accède),
  # alors que QUIZUP_AUTH_SERVER_URL reste in-cluster (JWKS côté serveur).
  MICROSERVICE_SWAGGER_OAUTH2_AUTHORIZATION_SERVER_URL: https://identity.quizup.cnadjim.fr

  SPRING_APPLICATION_JSON: >-
    {"spring":{"security":{"oauth2":{"client":{"registration":{"server-client":{"provider":"quizup-identity","client-id":"server","client-secret":"${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SERVER_CLIENT_CLIENT_SECRET}","authorization-grant-type":"client_credentials","scope":"openid"}},"provider":{"quizup-identity":{"token-uri":"http://identity.quizup-prod.svc.cluster.local/oauth2/token","jwk-set-uri":"http://identity.quizup-prod.svc.cluster.local/oauth2/jwks"}}}}}}}
